groups:
  - name: devhub-durability
    rules:
      - alert: DevHubMetricsUnavailable
        expr: up{job="devhub-api"} == 0
        for: 3m
        labels: {severity: critical}
        annotations:
          summary: "DevHub API metrics scrape failed"
      - alert: DevHubOutboxBacklog
        expr: devhub_outbox_oldest_age_seconds > 300
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Oldest pending durable outbox event exceeds five minutes"
      - alert: DevHubValidationStalled
        expr: devhub_validation_expired_leases > 0
        for: 5m
        labels: {severity: critical}
        annotations:
          summary: "Validation runner lease expired"
      - alert: DevHubIntegrationBacklog
        expr: devhub_integration_oldest_queue_age_seconds > 600
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Integration admission is not draining"
      - alert: DevHubPublicationBacklog
        expr: devhub_object_publications_pending > 50
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "S3 object publication backlog increased"
      - alert: DevHubHighErrorRate
        expr: sum(rate(devhub_operation_errors_total[5m])) / clamp_min(sum(rate(devhub_operation_duration_seconds_count[5m])), 0.001) > 0.05
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: "Native API error fraction exceeded provisional threshold"
      - alert: DevHubSlowP99
        expr: histogram_quantile(0.99, sum by (le, operation) (rate(devhub_operation_duration_seconds_bucket[10m]))) > 5
        for: 15m
        labels: {severity: warning}
        annotations:
          summary: "Native operation p99 exceeds provisional 5-second diagnostic threshold"
      - alert: DevHubCacheUnavailable
        expr: up{job="devhub-cache"} == 0
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: "Node cache telemetry unavailable"
      - alert: DevHubCacheBreakerOpen
        expr: devhub_cache_origin_breaker_open == 1 or devhub_cache_region_breaker_open == 1
        for: 2m
        labels: {severity: warning}
        annotations:
          summary: "Object cache upstream circuit is open"
