services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--storage.tsdb.retention.time=7d"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./alerts.yml:/etc/prometheus/alerts.yml:ro
      - ./metrics.token:/etc/prometheus/metrics.token:ro
      - prometheus_data:/prometheus
    extra_hosts: ["host.docker.internal:host-gateway"]
    ports: ["127.0.0.1:9090:9090"]
  grafana:
    image: grafana/grafana:11.6.0
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/devhub.yml:ro
      - ./grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/devhub.yml:ro
      - ./dashboard.json:/var/lib/grafana/dashboards/devhub.json:ro
    ports: ["127.0.0.1:3001:3000"]
volumes:
  prometheus_data:
