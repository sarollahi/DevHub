global:
  scrape_interval: 15s
  evaluation_interval: 15s
rule_files:
  - /etc/prometheus/alerts.yml
scrape_configs:
  - job_name: devhub-api
    metrics_path: /api/ops/metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ["host.docker.internal:3000"]
  - job_name: devhub-cache
    metrics_path: /metrics
    scheme: http
    authorization:
      type: Bearer
      credentials_file: /etc/prometheus/metrics.token
    static_configs:
      - targets: ["host.docker.internal:9109"]
