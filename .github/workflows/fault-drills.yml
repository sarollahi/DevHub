name: Isolated dependency fault drills
on:
  push:
    branches: ["feature/performance-resilience-observability"]
  pull_request:
    branches: [develop]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  recovery:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub?schema=public
      REDIS_URL: redis://localhost:6379
      APP_SECRET: ci-only-long-random-testing-secret-123456789
      DEVHUB_FAULT_DRILL: isolated-local-only
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start isolated real dependencies
        run: docker compose up -d --wait db redis minio
      - name: Initialize S3 bucket with tested CI command
        run: |
          docker run --rm --network host --entrypoint /bin/sh cgr.dev/chainguard/minio-client:latest-dev -c \
            'until mc alias set local http://127.0.0.1:9000 devhub-local devhub-local-password-change-in-production; do sleep 2; done; mc mb --ignore-existing local/devhub-objects'
      - name: Apply schema
        run: npm run db:generate && npm run db:deploy
      - name: Publish real fixture before failures
        run: npm run bench:lifecycle -- --submissions=4 --changesets=8 --concurrency=4 --depth=3 --monorepo-paths=8 --ref-writers=4 --integration-jobs=2 --ci-jobs=0 --queries=4 --blobs=3
      - name: Redis outage, restart, reconciliation
        run: npm run ops:fault-drill -- --service=redis --seconds=2
      - name: Object-store outage, restart, reconciliation
        run: npm run ops:fault-drill -- --service=minio --seconds=2
      - name: PostgreSQL outage, restart, reconciliation
        run: npm run ops:fault-drill -- --service=db --seconds=2
      - name: Regional TCP partition and cache restart
        run: node --test tests/resilience-partition.test.mjs
      - name: Real DB, Redis and object-store network partitions
        run: |
          mkdir -p artifacts/distributed-faults
          node scripts/network-partition.mjs --service=db --seconds=3 --output=artifacts/distributed-faults/db.json
          node scripts/network-partition.mjs --service=redis --seconds=3 --output=artifacts/distributed-faults/redis.json
          node scripts/network-partition.mjs --service=minio --seconds=3 --output=artifacts/distributed-faults/minio.json
      - name: Final invariant checks
        run: npm run ops:reconcile -- --sample=100
      - name: Upload measured isolation results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: distributed-network-isolation
          path: artifacts/distributed-faults/
          if-no-files-found: warn
      - name: Show dependency states
        if: always()
        run: docker compose ps

  physical-failover:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      DEVHUB_FAULT_DRILL: isolated-local-only
    steps:
      - uses: actions/checkout@v4
      - name: Stream PostgreSQL WAL to a second process and promote with old writer fenced
        run: bash scripts/pg-failover-drill.sh
      - name: Archive real PostgreSQL promotion evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pg-physical-failover
          path: artifacts/distributed-faults/
          if-no-files-found: warn

  independent-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DEVHUB_FAULT_DRILL: isolated-local-only
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub?schema=public
      OBJECT_STORE_ENDPOINT: http://127.0.0.1:9000
      OBJECT_STORE_BUCKET: devhub-objects
      OBJECT_STORE_REGION: us-east-1
      OBJECT_STORE_ACCESS_KEY: devhub-local
      OBJECT_STORE_SECRET_KEY: devhub-local-password-change-in-production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Start real PostgreSQL and S3-compatible storage
        run: docker compose up -d --wait db minio
      - name: Initialize source bucket
        run: |
          docker run --rm --network host --entrypoint /bin/sh cgr.dev/chainguard/minio-client:latest-dev -c \
            'until mc alias set old http://127.0.0.1:9000 devhub-local devhub-local-password-change-in-production; do sleep 2; done; mc mb --ignore-existing old/devhub-objects'
      - name: Apply migrations
        run: npm run db:generate && npm run db:deploy
      - name: Publish actual external S3 object and authoritative branch
        run: npx tsx scripts/restore-fixture.ts
      - name: Independently restore DB dump and complete S3 object inventory
        run: bash scripts/backup-restore-drill.sh
      - name: Archive full inventory and restoration evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: independent-database-object-restore
          path: artifacts/distributed-faults/
          if-no-files-found: warn
      - name: Container state
        if: always()
        run: docker compose ps
