name: Related-review PostgreSQL and worker scale
on:
  push:
    branches: ["feature/repository-wide-review-indexes"]
    paths:
      - "scripts/bench-related-review-db.ts"
      - "scripts/eval-related-semantic.ts"
      - "scripts/prepare-related-embeddings.py"
      - "tests/fixtures/related-semantic.json"
      - "src/review/**"
      - "src/source-control/canonical.ts"
      - "prisma/**"
      - ".github/workflows/related-review-benchmark.yml"
      - "package.json"
  workflow_dispatch:
    inputs:
      semantic_provider:
        description: "Evaluate the configured external embedding provider on human-labeled engineering intent pairs"
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  postgres-review-index:
    name: Persisted indexes and review worker (size ${{ matrix.count }})
    runs-on: ubuntu-latest
    timeout-minutes: 105
    strategy:
      fail-fast: false
      matrix:
        count: [1000, 10000, 100000]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: devhub
          POSTGRES_PASSWORD: devhub
          POSTGRES_DB: devhub
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U devhub -d devhub"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub?schema=public
      APP_SECRET: ci-only-long-random-testing-secret-123456789
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
          cache: npm
      - name: Install dependencies
        run: npm ci --no-audit --no-fund
      - name: Generate Prisma and migrate real PostgreSQL
        run: npm run db:generate && npm run db:deploy
      - name: Query, storage, freshness, and real-worker measurements
        run: |
          set -euo pipefail
          mkdir -p reports
          if [ "${{ matrix.count }}" = "1000" ]; then workers=1000; else workers=0; fi
          npx tsx scripts/bench-related-review-db.ts \
            --count=${{ matrix.count }} --workers=$workers --concurrency=4 \
            --output=reports/review-db-${{ matrix.count }}.json
      - name: Labeled semantic retrieval baseline (not an external model)
        if: matrix.count == 1000
        run: npm run bench:related-semantic -- --mode=lexical --output=reports/related-semantic-lexical.json
      - name: Publish actual measurements, including on failure
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: related-review-postgres-${{ matrix.count }}
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  model-semantic-evaluation:
    name: Actual ONNX sentence embedding precision / recall
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.18", cache: npm }
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: npm ci --no-audit --no-fund
      - name: Install reproducible CPU ONNX embedding runtime
        run: python -m pip install --disable-pip-version-check fastembed==0.9.1
      - name: Generate embeddings from a published sentence embedding model
        run: python scripts/prepare-related-embeddings.py
      - name: Measure actual ANN and cosine precision/recall on labeled text
        run: npm run bench:related-semantic -- --mode=model --vectors=reports/related-semantic-model-vectors.json --output=reports/related-semantic-model.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: related-semantic-real-model
          path: reports/
          if-no-files-found: warn
          retention-days: 30

  provider-semantic-evaluation:
    name: Optional external provider semantic accuracy (labeled)
    if: github.event_name == 'workflow_dispatch' && inputs.semantic_provider == true
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEVHUB_EMBEDDING_ENDPOINT: ${{ secrets.DEVHUB_EMBEDDING_ENDPOINT }}
      DEVHUB_EMBEDDING_MODEL: ${{ vars.DEVHUB_EMBEDDING_MODEL }}
      DEVHUB_EMBEDDING_API_KEY: ${{ secrets.DEVHUB_EMBEDDING_API_KEY }}
      DEVHUB_EMBEDDING_PROVIDER: openai-compatible
      DEVHUB_EMBEDDING_USD_PER_MILLION_TOKENS: ${{ vars.DEVHUB_EMBEDDING_USD_PER_MILLION_TOKENS }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: "22.18", cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Evaluate actual provider precision, recall and candidate coverage
        run: |
          test -n "$DEVHUB_EMBEDDING_ENDPOINT"
          test -n "$DEVHUB_EMBEDDING_MODEL"
          npm run bench:related-semantic -- --mode=provider --output=reports/related-semantic-provider.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: related-semantic-real-provider
          path: reports/
          if-no-files-found: warn
