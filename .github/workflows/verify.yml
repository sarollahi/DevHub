name: Verify
on:
  push:
    branches: [main]
  pull_request:
jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18'
          cache: npm
      # A lockfile should be generated and committed once package registry access is available.
      - run: npm install --no-audit --no-fund
      - run: npx prisma validate
        env:
          DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub
      - run: npm run db:generate
        env:
          DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
        env:
          DATABASE_URL: postgresql://devhub:devhub@localhost:5432/devhub
          APP_SECRET: ci-only-long-random-testing-secret-123456789
          ADMIN_TOKEN: ci-only-long-admin-testing-secret-123456789
